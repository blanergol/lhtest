# Настройки командной памяти: правятся в репозитории как обычный файл и
# действуют для всех, кто эту память читает. Ключи, которых сервис не знает,
# игнорируются; сломанный файл не останавливает память — работают значения по
# умолчанию, а причина видна в диагностике.
schema_version: 1

index:
  # Что не попадает в поиск вовсе (fnmatch по пути от корня репозитория).
  # Архив сюда добавлять не нужно: убранные в архив записи индексируются с
  # пометкой и не выдаются обычным поиском, но находятся по явной просьбе
  # «поищи и в убранном» (include_archived).
  exclude: []
  # Файлы больше этого размера не индексируются.
  max_file_bytes: 1048576      # 1 МБ
  # Как часто сверять дерево записей с индексом: сверка ловит удаления, о
  # которых не приходит событий. 0 выключает. Переменная развёртывания
  # TB_RESCAN_SECONDS, если задана, сильнее этого значения.
  rescan_seconds: 60

search:
  # Гибридное ранжирование: сколько кандидатов берёт каждая ветка (векторная и
  # лексическая) до слияния, константа слияния RRF и вес устаревших записей.
  candidates_per_source: 50
  rrf_k: 60
  superseded_weight: 0.5       # устаревшее не выбрасываем, но опускаем и помечаем
  # Сколько находок отдаётся наружу, если запрос не попросил иначе.
  top_k: 20

hygiene:
  # Через сколько месяцев без правок запись предлагается к пересмотру. Это
  # порог напоминания: гигиена только предлагает, решает человек, ничего не
  # удаляется автоматически.
  stale_months: 12
  remind_every_days: 30
  archive_after_months: 12
  usage_window_months: 1
  verify_months:
    runbook: 6
    howto: 6
    decision: 12
    convention: 12

maintenance:
  # Что сервис делает сам, не спрашивая человека. Оба флага — выключатели
  # отката: при false поведение возвращается к ручному.
  # Автоперестроение индекса при смене модели/формата (иначе — отказ 409).
  auto_rebuild: true
  # Автообновление управляемого образа сервиса (исполняет плагин).
  auto_upgrade: true

projects:
  # Репозитории проектов, чья память живёт в этом хранилище (D22): по remote
  # репозитория мастер и внешние агенты получают «suggested» хранилище без
  # вопроса. Сам репозиторий памяти указывать не нужно — он и есть хранилище.
  []

limits:
  # Тело записи, которое принимает сервис (от агента или интерфейса).
  body_bytes: 65536
  # Потолок разовой публикации: больше файлов за раз — почти всегда ошибка
  # (не туда смонтированный каталог), а не работа человека.
  files_per_commit: 200
